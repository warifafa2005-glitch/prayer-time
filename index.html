<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prayer Times — London</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #041f17;
      background: radial-gradient(circle at top, #083829 0%, #031711 100%);
      color: #ffffff;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      padding: 4vh 5vw;
      overflow: hidden;
    }
    header {
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-align-items: center;
      align-items: center;
      border-bottom: 2px solid #125440;
      padding-bottom: 3vh;
    }
    .location {
      font-size: 2.6rem;
      font-weight: bold;
      color: #50c878;
    }
    .dates {
      font-size: 1.4rem;
      color: #a7d7c5;
      margin-top: 8px;
    }
    .clock-box {
      text-align: right;
    }
    #clock {
      font-size: 4.5rem;
      font-weight: bold;
      color: #ecfdf5;
      line-height: 1;
    }
    #countdown {
      font-size: 1.4rem;
      color: #50c878;
      margin-top: 8px;
    }
    .prayers-grid {
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      margin: auto 0;
    }
    .prayer-card {
      -webkit-flex: 1;
      flex: 1;
      margin: 0 0.8vw;
      background: #072b20;
      border: 3px solid #125440;
      border-radius: 18px;
      padding: 5vh 1vw;
      text-align: center;
    }
    .prayer-card.next {
      background: #0d4a38;
      border-color: #10b981;
      box-shadow: 0 0 28px rgba(16, 185, 129, 0.35);
      -webkit-transform: scale(1.04);
      transform: scale(1.04);
    }
    .prayer-name {
      font-size: 1.8rem;
      color: #9ed4c0;
      margin-bottom: 2vh;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .prayer-card.next .prayer-name {
      color: #ffffff;
      font-weight: bold;
    }
    .prayer-time {
      font-size: 3.3rem;
      font-weight: bold;
      color: #34d399;
    }
    .prayer-card.next .prayer-time {
      color: #f3d27a;
    }
    .next-badge {
      display: inline-block;
      margin-top: 1.5vh;
      padding: 4px 14px;
      background: #10b981;
      color: #031711;
      font-weight: bold;
      font-size: 0.95rem;
      border-radius: 20px;
      visibility: hidden;
    }
    .prayer-card.next .next-badge {
      visibility: visible;
    }
    footer {
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-align-items: center;
      align-items: center;
      color: #6ea892;
      font-size: 1.1rem;
      border-top: 2px solid #125440;
      padding-top: 2vh;
    }
    button.tv-btn {
      background: #10b981;
      color: #031711;
      border: 3px solid transparent;
      border-radius: 10px;
      padding: 10px 20px;
      margin-left: 10px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
    }
    button.tv-btn:focus {
      border-color: #ecfdf5;
      outline: none;
    }
    button.tv-btn.playing {
      background: #f3d27a;
      color: #031711;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="location">London, United Kingdom</div>
      <div class="dates" id="date-display">Loading date...</div>
    </div>
    <div class="clock-box">
      <div id="clock">--:--</div>
      <div id="countdown">Next prayer in --:--</div>
    </div>
  </header>

  <main class="prayers-grid">
    <div class="prayer-card" id="card-Fajr">
      <div class="prayer-name">Fajr</div>
      <div class="prayer-time" id="Fajr">--:--</div>
      <div class="next-badge">NEXT</div>
    </div>
    <div class="prayer-card" id="card-Sunrise">
      <div class="prayer-name">Sunrise</div>
      <div class="prayer-time" id="Sunrise">--:--</div>
      <div class="next-badge">NEXT</div>
    </div>
    <div class="prayer-card" id="card-Dhuhr">
      <div class="prayer-name">Dhuhr</div>
      <div class="prayer-time" id="Dhuhr">--:--</div>
      <div class="next-badge">NEXT</div>
    </div>
    <div class="prayer-card" id="card-Asr">
      <div class="prayer-name">Asr</div>
      <div class="prayer-time" id="Asr">--:--</div>
      <div class="next-badge">NEXT</div>
    </div>
    <div class="prayer-card" id="card-Maghrib">
      <div class="prayer-name">Maghrib</div>
      <div class="prayer-time" id="Maghrib">--:--</div>
      <div class="next-badge">NEXT</div>
    </div>
    <div class="prayer-card" id="card-Isha">
      <div class="prayer-name">Isha</div>
      <div class="prayer-time" id="Isha">--:--</div>
      <div class="next-badge">NEXT</div>
    </div>
  </main>

  <footer>
    <span id="audio-status">Auto-Adhan Ready (Press any remote button once if TV mutes it)</span>
    <div>
      <button class="tv-btn" id="fajr-btn" onclick="toggleAudio('fajr')">Test Fajr Adhan</button>
      <button class="tv-btn" id="regular-btn" onclick="toggleAudio('regular')">Test Regular Adhan</button>
    </div>
  </footer>

  <audio id="fajr-audio" src="./fajr.mp3" preload="auto"></audio>
  <audio id="regular-audio" src="https://raw.githubusercontent.com/Kiwifu/adhan-mp3/main/Ali_Ibn_Ahmad_Mala_-_HQ_(%D8%B9%D9%84%D9%8A_%D8%A8%D9%86_%D8%A3%D8%AD%D9%85%D8%AF_%D9%85%D9%84%D8%A7).mp3" preload="auto"></audio>

  <script>
    var PRAYER_LIST = ["Fajr", "Sunrise", "Dhuhr", "Asr", "Maghrib", "Isha"];
    var ADHAN_PRAYERS = ["Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"];
    var todayTimings = {};
    var lastPlayedKey = "";
    var audioUnlocked = false;
    var hasLoadedOnce = false;

    var fajrAudio = document.getElementById("fajr-audio");
    var regularAudio = document.getElementById("regular-audio");
    var fajrBtn = document.getElementById("fajr-btn");
    var regularBtn = document.getElementById("regular-btn");
    var audioStatus = document.getElementById("audio-status");

    function pad2(n) {
      return n < 10 ? "0" + n : "" + n;
    }

    function unlockAudioSilently() {
      if (audioUnlocked) return;
      var list = [fajrAudio, regularAudio];
      for (var i = 0; i < list.length; i++) {
        (function(el) {
          el.muted = true;
          var p = el.play();
          if (p && p.then) {
            p.then(function() {
              el.pause();
              el.currentTime = 0;
              el.muted = false;
            }).catch(function() {
              el.muted = false;
            });
          } else {
            el.pause();
            el.currentTime = 0;
            el.muted = false;
          }
        })(list[i]);
      }
      audioUnlocked = true;
      audioStatus.innerHTML = "TV Audio Unlocked — Fajr &amp; Daily Adhans armed";
    }

    document.addEventListener("click", unlockAudioSilently);
    document.addEventListener("keydown", unlockAudioSilently);

    function stopAllAudio() {
      fajrAudio.pause();
      fajrAudio.currentTime = 0;
      fajrBtn.innerHTML = "Test Fajr Adhan";
      fajrBtn.className = "tv-btn";

      regularAudio.pause();
      regularAudio.currentTime = 0;
      regularBtn.innerHTML = "Test Regular Adhan";
      regularBtn.className = "tv-btn";
    }

    function playMediaSafe(player, btn, stopLabel, statusMsg) {
      player.muted = false;
      var p = player.play();
      if (p && p.then) {
        p.then(function() {
          btn.innerHTML = stopLabel;
          btn.className = "tv-btn playing";
          audioStatus.innerHTML = statusMsg;
        }).catch(function() {
          audioStatus.innerHTML = "Could not play audio — check TV volume or connection";
        });
      } else {
        btn.innerHTML = stopLabel;
        btn.className = "tv-btn playing";
        audioStatus.innerHTML = statusMsg;
      }
    }

    function toggleAudio(type) {
      audioUnlocked = true;
      var targetAudio = type === "fajr" ? fajrAudio : regularAudio;
      var targetBtn = type === "fajr" ? fajrBtn : regularBtn;
      var wasPlaying = !targetAudio.paused;

      stopAllAudio();

      if (!wasPlaying) {
        playMediaSafe(
          targetAudio,
          targetBtn,
          type === "fajr" ? "Stop Fajr Adhan" : "Stop Regular Adhan",
          type === "fajr" ? "Playing Fajr Adhan..." : "Playing Regular Adhan..."
        );
      } else {
        audioStatus.innerHTML = "TV Audio Unlocked — Fajr &amp; Daily Adhans armed";
      }
    }

    fajrAudio.onended = function() {
      stopAllAudio();
      audioStatus.innerHTML = "TV Audio Unlocked — Fajr &amp; Daily Adhans armed";
    };
    regularAudio.onended = function() {
      stopAllAudio();
      audioStatus.innerHTML = "TV Audio Unlocked — Fajr &amp; Daily Adhans armed";
    };

    function setFallbackDate() {
      var now = new Date();
      var days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      var months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      document.getElementById("date-display").innerHTML =
        days[now.getDay()] + ", " + now.getDate() + " " + months[now.getMonth()] + " " + now.getFullYear();
    }

    function applyApiData(json) {
      todayTimings = json.data.timings;
      for (var i = 0; i < PRAYER_LIST.length; i++) {
        var prayer = PRAYER_LIST[i];
        var cleanTime = todayTimings[prayer].split(" ")[0];
        todayTimings[prayer] = cleanTime;
        document.getElementById(prayer).innerHTML = cleanTime;
      }

      var greg = json.data.date.readable;
      var hijri = json.data.date.hijri;
      document.getElementById("date-display").innerHTML =
        greg + " &nbsp;&bull;&nbsp; " + hijri.day + " " + hijri.month.en + " " + hijri.year + " AH";

      hasLoadedOnce = true;
      updateClockAndNextPrayer();
    }

    function requestJson(url, onSuccess, onError) {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              onSuccess(JSON.parse(xhr.responseText));
            } catch (e) {
              if (onError) onError();
            }
          } else {
            if (onError) onError();
          }
        }
      };
      xhr.onerror = function() {
        if (onError) onError();
      };
      xhr.send();
    }

    function loadPrayerTimes() {
      var directUrl = "https://api.aladhan.com/v1/timingsByCity?city=London&country=United%20Kingdom&method=3";
      var proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(directUrl);

      requestJson(directUrl, applyApiData, function() {
        // Fallback through CORS/SSL proxy if TV blocks api.aladhan.com certificate
        requestJson(proxyUrl, applyApiData, function() {
          if (!hasLoadedOnce) setFallbackDate();
        });
      });
    }

    function updateClockAndNextPrayer() {
      var now = new Date();
      var currentHHMM = pad2(now.getHours()) + ":" + pad2(now.getMinutes());
      document.getElementById("clock").innerHTML = currentHHMM;

      if (!todayTimings.Fajr) return;

      for (var i = 0; i < ADHAN_PRAYERS.length; i++) {
        var prayer = ADHAN_PRAYERS[i];
        var triggerKey = now.toDateString() + "-" + prayer;
        if (todayTimings[prayer] === currentHHMM && lastPlayedKey !== triggerKey) {
          lastPlayedKey = triggerKey;
          stopAllAudio();

          var isFajr = (prayer === "Fajr");
          playMediaSafe(
            isFajr ? fajrAudio : regularAudio,
            isFajr ? fajrBtn : regularBtn,
            isFajr ? "Stop Fajr Adhan" : "Stop Regular Adhan",
            "Time for " + prayer + " — Playing " + (isFajr ? "Fajr " : "") + "Adhan"
          );
        }
      }

      for (var j = 0; j < PRAYER_LIST.length; j++) {
        document.getElementById("card-" + PRAYER_LIST[j]).className = "prayer-card";
      }

      var nextPrayer = null;
      var nextTimeObj = null;

      for (var k = 0; k < PRAYER_LIST.length; k++) {
        var name = PRAYER_LIST[k];
        var parts = todayTimings[name].split(":");
        var prayerDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(parts[0], 10), parseInt(parts[1], 10), 0);

        if (prayerDate > now) {
          nextPrayer = name;
          nextTimeObj = prayerDate;
          break;
        }
      }

      if (!nextPrayer) {
        nextPrayer = "Fajr";
        var fajrParts = todayTimings["Fajr"].split(":");
        nextTimeObj = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, parseInt(fajrParts[0], 10), parseInt(fajrParts[1], 10), 0);
      }

      document.getElementById("card-" + nextPrayer).className = "prayer-card next";

      var diffMs = nextTimeObj - now;
      var diffHrs = Math.floor(diffMs / 3600000);
      var diffMins = Math.floor((diffMs % 3600000) / 60000);
      document.getElementById("countdown").innerHTML =
        nextPrayer + " in " + diffHrs + "h " + diffMins + "m";
    }

    window.onload = function() {
      fajrBtn.focus();
      setFallbackDate();
      updateClockAndNextPrayer();
      loadPrayerTimes();
    };
    setInterval(updateClockAndNextPrayer, 1000);
    setInterval(loadPrayerTimes, 3600000);
  </script>
</body>
</html>
